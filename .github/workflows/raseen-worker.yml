name: رسين · جمع الأخبار وتحليلها

# Every hour: fetch the RSS sources, group duplicates into stories, suggest the first source,
# and write the brief. Results go to Supabase. Can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: raseen-worker
  cancel-in-progress: false

jobs:
  run:
    # hourly runs start once Supabase is set up; a manual run always works (tests only, until then)
    if: github.event_name == 'workflow_dispatch' || vars.SUPABASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: raseen-backend/worker
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HOME: ~/.cache/huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raseen-backend/worker/requirements*.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ml.txt

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q -rs tests

      - name: Run Raseen
        if: env.SUPABASE_URL != ''
        run: python -m raseen.run
